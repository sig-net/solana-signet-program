name: CI Tests

on:
  workflow_run:
    workflows: ['Publish Docker Image']
    types: [completed]
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'pull_request' }}
    container:
      image: ghcr.io/${{ github.repository }}/signet-anchor-build-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      MPC_ROOT_KEY: ${{ secrets.MPC_ROOT_KEY }}
      # A local anvil (started below): the responder's startup probe requires
      # the callTracer debug API, which hosted plans like plain Infura lack,
      # and a local node also frees fork PRs from needing any RPC secret.
      EVM_RPC_URL: http://127.0.0.1:8545
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn install

      - name: Build fakenet-signer
        working-directory: fakenet-signer
        run: yarn build

      - name: Run lint
        working-directory: signet-program
        run: yarn run lint

      - name: Run format check
        working-directory: signet-program
        run: yarn run format:check

      - name: Install foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start anvil
        run: |
          anvil --host 127.0.0.1 --port 8545 > /tmp/anvil.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:8545 > /dev/null; then
              echo "anvil is up"
              exit 0
            fi
            sleep 1
          done
          echo "anvil did not come up" >&2
          cat /tmp/anvil.log >&2
          exit 1

      - name: Generate keypair
        run: solana-keygen new --no-bip39-passphrase --force

      - name: Set Solana private key
        run: |
          SOLANA_PRIVATE_KEY=$(cat ~/.config/solana/id.json)
          echo "SOLANA_PRIVATE_KEY=$SOLANA_PRIVATE_KEY" >> $GITHUB_ENV

      - name: Run Anchor tests
        working-directory: signet-program
        run: |
          anchor --version
          anchor test

      - name: Run type check
        working-directory: signet-program
        run: yarn run typecheck
