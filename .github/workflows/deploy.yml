name: Deploy Program

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: Target cluster
        type: choice
        options: [testnet, devnet]

concurrency:
  group: deploy-${{ inputs.cluster }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.cluster }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: sol-${{ inputs.cluster }}
    permissions:
      contents: read
    container:
      image: ghcr.io/${{ github.repository }}/signet-anchor-build-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache smoke test build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: signet-program/scripts/smoke_respond_bidirectional
          key: smoke

      - name: Write keypairs from secrets
        env:
          DEPLOYER_KEY: ${{ secrets.SOL_DEPLOYER_KEY }}
          PROGRAM_KEY: ${{ inputs.cluster == 'devnet' && secrets.SOL_PROGRAM_KEY_DEVNET || secrets.SOL_PROGRAM_KEY_TESTNET }}
        run: |
          printf '%s' "$DEPLOYER_KEY" > "$HOME/deployer.json"
          printf '%s' "$PROGRAM_KEY"  > "$HOME/program-key.json"
          chmod 600 "$HOME"/*.json

      - name: Deploy
        working-directory: signet-program
        run: scripts/deploy.sh ${{ inputs.cluster }}

      - name: Triage on failure
        if: failure()
        working-directory: signet-program
        run: scripts/triage.sh ${{ inputs.cluster }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chain_signatures-${{ inputs.cluster }}-${{ github.sha }}
          path: |
            signet-program/target/deploy/chain_signatures.so
            signet-program/target/idl/*.json
          if-no-files-found: error
